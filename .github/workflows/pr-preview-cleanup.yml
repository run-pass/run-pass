name: pr preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Tear down PR preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - run: npm ci
        working-directory: ./cloudflare-worker

      - name: Delete preview Worker
        working-directory: ./cloudflare-worker
        # Never fail the run: the Worker may not exist if the preview job was
        # skipped or already cleaned up.
        run: npx wrangler delete "runpass-pr-${{ github.event.pull_request.number }}" || true
