name: monitor prod apple passbook

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  monitor:
    name: Apple Wallet production monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple Wallet production passbook
        run: ./scripts/check-apple-passbook.sh
