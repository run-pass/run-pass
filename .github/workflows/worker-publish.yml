name: publish cloudflare worker

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - run: npm ci
        working-directory: ./cloudflare-worker

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: ./cloudflare-worker
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --env production
          environment: 'production'
          # Only genuine secrets. The public identifiers live in wrangler.toml [vars].
          secrets: |
              SIGNER_CERT
              SIGNER_KEY
              SIGNER_KEY_PASSPHRASE
              GOOGLE_WALLET_SERVICE_ACCOUNT_PRIVATE_KEY
        env:
          SIGNER_CERT: ${{ secrets.SIGNER_CERT }}
          SIGNER_KEY: ${{ secrets.SIGNER_KEY }}
          SIGNER_KEY_PASSPHRASE: ${{ secrets.SIGNER_KEY_PASSPHRASE }}
          GOOGLE_WALLET_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_WALLET_SERVICE_ACCOUNT_PRIVATE_KEY }}
